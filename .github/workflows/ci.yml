name: ci

# Pull requests only, to save Actions minutes: pushes don't run this.
# release.yml runs the same tests on a release tag, and the Actions tab
# can start this workflow by hand on any branch (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The fetch scripts pin the archive URLs and hashes, so their hashes are the cache key.
      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: .native
          key: native-${{ runner.os }}-${{ hashFiles('scripts/fetch-native-libs.ps1', 'scripts/Get-VerifiedArchive.ps1') }}

      - name: Fetch native libraries (no-op on a cache hit)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-native-libs.ps1

      # With no toolchain named, rustup installs the version
      # rust-toolchain.toml pins, with the components it lists.
      - name: Install Rust (the version in rust-toolchain.toml)
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # rust-cache keeps ~/.cargo/bin, so this is a no-op once cargo-about is
      # cached. cargo-about 0.9.2 builds its binary only with the `cli` feature.
      - name: Install cargo-about 0.9.2 (no-op if cached)
        shell: pwsh
        run: |
          $version = ''
          try { $version = (cargo about --version 2>$null | Out-String).Trim() } catch { }
          if ($version -ne 'cargo-about 0.9.2') {
            cargo install cargo-about --version 0.9.2 --locked --features cli
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build third-party notices
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-notices.ps1

      - name: Upload third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: THIRD_PARTY_NOTICES
          path: target/notices/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
