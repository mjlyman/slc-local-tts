name: release

# Pushing a tag such as v0.2.0 builds the installer and publishes it as a
# GitHub release. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      # The fetch scripts pin the archive URLs and hashes, so their hashes are the cache key.
      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: .native
          key: native-${{ runner.os }}-${{ hashFiles('scripts/fetch-native-libs.ps1', 'scripts/Get-VerifiedArchive.ps1') }}

      - name: Fetch native libraries (no-op on a cache hit)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-native-libs.ps1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the Cargo.toml version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ((ConvertFrom-Json $metadata).packages | Where-Object { $_.name -eq 'slc-local-tts' }).version
          if ("v$version" -ne '${{ github.ref_name }}') {
            Write-Error "The tag is '${{ github.ref_name }}', but Cargo.toml says version $version. Tag the commit as v$version, or change the version in Cargo.toml."
            exit 1
          }

      - name: Test
        run: cargo test

      # rust-cache keeps ~/.cargo/bin, so this is a no-op once cargo-about is
      # cached. cargo-about 0.9.2 builds its binary only with the `cli` feature.
      - name: Install cargo-about 0.9.2 (no-op if cached)
        shell: pwsh
        run: |
          $version = ''
          try { $version = (cargo about --version 2>$null | Out-String).Trim() } catch { }
          if ($version -ne 'cargo-about 0.9.2') {
            cargo install cargo-about --version 0.9.2 --locked --features cli
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # dotnet puts global tools in ~/.dotnet/tools, which later steps only
      # see once it is on GITHUB_PATH.
      - name: Install vpk 1.2.161
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Build and pack the release
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pack-release.ps1

      - name: Upload the release to GitHub
        shell: pwsh
        run: |
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --tag ${{ github.ref_name }} --releaseName "SLC Local TTS ${{ github.ref_name }}" --publish -o target\velopack\Releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set the release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} --notes-file target\pack\release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
