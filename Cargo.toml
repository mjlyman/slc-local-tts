[package]
name = "slc-local-tts"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false
description = "Local, ElevenLabs-compatible text-to-speech server for Self-Loading Cargo."

[lib]
name = "slc_local_tts"
path = "src/lib.rs"

# The tray program: no console window.
[[bin]]
name = "slc-local-tts"
path = "src/main.rs"

# The console program: serve, voices and download in a terminal.
[[bin]]
name = "slc-local-tts-cli"
path = "src/bin/cli.rs"

[dependencies]
# Speech runtime and phonemizer: exact pins. piper-phonemize-sys is
# listed directly because piper-phonemize only asks for a caret range.
sherpa-onnx = "=2.0.1"
piper-phonemize = "=1.5.9"
piper-phonemize-sys = "=1.5.9"

# HTTP server
axum = "0.8"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "signal"] }
tower-http = { version = "0.6", features = ["catch-panic", "normalize-path"] }

# Model downloads (default TLS = native TLS, Windows SChannel). `blocking`
# is for the settings window, which talks to the server from plain threads.
reqwest = { version = "0.12", features = ["stream", "blocking"] }
sha2 = "0.10"
# bzip2 0.6 defaults to the pure-Rust backend (libbz2-rs-sys); no C library.
bzip2 = "0.6"
tar = "0.4"

# Config, errors, CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Edits config.toml in place, keeping the user's comments (exact pin).
toml_edit = "=0.25.17"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Installer and auto-update (exact pin)
velopack = "=1.2.161"

# The icon in the taskbar corner, and its menu (exact pin)
tray-icon = "=0.26.1"

# The settings window (exact pin): the OpenGL renderer, egui's bundled
# fonts as a fallback for Segoe UI, and screen-reader support.
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
# Checks that a Windows font file parses before it's handed to egui, which
# would stop the window on a damaged one. The same version egui's text
# layout already uses, so nothing extra is built.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }

# Windows APIs (priority, console, file system, memory stats, single instance,
# start with Windows, message boxes, the tray icon, the clipboard)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    # CreateMutexW (the single-instance check) is gated on this feature.
    "Win32_Security",
    # GetACP, for the test that checks the UTF-8 code page manifest, and
    # GetTimeFormatEx, for times in the user's own format.
    "Win32_Globalization",
    # Converting a time to the user's time zone.
    "Win32_System_Time",
    # The start-with-Windows entry in the user's Run key.
    "Win32_System_Registry",
    # Message boxes, and letting the settings window come to the front.
    "Win32_UI_WindowsAndMessaging",
    # The tray icon's size at the screen's scale.
    "Win32_UI_HiDpi",
    # Copying the SLC address to the clipboard.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # Reading the embedded manifest and icon back, in tests.
    "Win32_System_LibraryLoader",
    # Opening folders, files and web pages with their usual program.
    "Win32_UI_Shell",
    # COM on the thread that opens them, as ShellExecuteW asks.
    "Win32_System_Com",
    # Playing a voice's preview in the settings window (PlaySoundW).
    "Win32_Media_Audio",
] }

[build-dependencies]
# The exe's icon and version details (exact pin)
winresource = "=0.1.34"

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"
walkdir = "2"
# Drives the settings window in tests, with no screen (exact pin).
egui_kittest = "=0.37.0"

[profile.release]
# A panic must never take the server down: CatchPanicLayer turns a handler
# panic into a response, and a panicking blocking task surfaces as a JoinError.
# Both rely on panics unwinding rather than aborting the process.
panic = "unwind"
