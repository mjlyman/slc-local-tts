# cargo-about configuration: which Rust crate licences may be compiled into
# slc-local-tts.exe. scripts/make-notices.ps1 runs it.
#
# Rule: a licence goes on this list only if the FSF lists it as compatible
# with GPL-3.0. Ask before adding one.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "GPL-3.0-or-later", # the project's own licence
    "bzip2-1.0.6", # keep notices, mark modified versions, no endorsement: extra terms GPLv3 section 7(b)-(d) allows
]

# Only the crates that end up in the Windows exe.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Skips our own crate (publish = false), which is under LICENSE.
private = { ignore = true }
